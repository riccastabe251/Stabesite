<!DOCTYPE html>
<html>
    <head>
        <title>Position exercises</title>
    </head>
    <body style="height:3000px;">
        <div style="position:fixed; width:100px; background-color: green; color: white; right:0px; top:0px; bottom:0px;">Sidebar</div>
        <div style="position:fixed; right:20px; bottom:20px; background-color: black; color:white;">Bottom-right</div>
        <!--<div style="position:fixed; background-color: black; top:0px; bottom:0px; left:0px; right:0px;"></div>-->
        <div style="display:flex; flex-direction:row; justify-content: center; align-items: center; position:fixed; background-color: rgba(0,0,0,0.8);top:0px; bottom:0px; left:0px; right:0px;">
            <div style=" display:flex; flex-direction: column; background-color: white; width:300px; height:100px;">
                <div style="font-family:arial; font-weight: bold; text-align: left; margin-top:18px; margin-left:10px;">Modal Title</div>
                <div style="font-family:arial; font-size: 10px; margin-left:10px; margin-top:10px;">This is a modal</div>
                <button style="width:50px; margin-bottom:10px; margin:10px;">Close</button>
            </div>
        </div>

        <div class="fb-header" style="justify-content: space-between; align-items: center; display:flex; flex-direction: row; position:fixed; background-color: white; left:0px; right:0px; top:0px; height:50px;">
            <div class="left" style="display:flex;justify-content: center; align-items: center;">
            <img style="width:30px; height:30px; border-radius: 15px; margin-left:20px; object-fit: cover; object-position: top;" src="bellingham.jpg">
            <p style="font-family:arial; font-weight: bold; margin-left:10px; font-size: 14px; flex-shrink: 0;">Jude Bellingham</p>
            </div>
            <div class="buttons">
            <button style="background-color: #107ac1; border-width: 1px; border-color: #1477b9; border-style: solid; height:30px; width:80px; border-radius:4px; color:white; font-family: arial; font-size: 11px; font-weight: bold;">Add Friend</button>
            <button style="background-color: rgb(235, 234, 234); border:none; height:30px; width:80px; border-radius: 4px; font-family: arial; font-weight: bold;">Message</button>
            </div>
        </div>

        <div class="discord-sidebar" style="background-color: rgb(62, 62, 62); position:fixed; top:400px; left:0px; height:400px; width:200px; display:flex; flex-direction: row;">
            <div class="friends" style="position: fixed; left:0px; height:400px; width:70px; top:400px; bottom:0px; background-color: rgb(42, 42, 42); display:flex; flex-direction:column; align-items: center;">
                <img style="width:40px; height:40px; border-radius:20px; margin-top:20px;" src="bellingham.jpg">
                <img style="width:40px; height:40px; border-radius:20px; margin-top:8px;" src="mbappe.jpg">
                <img style="width:40px; height:40px; border-radius:20px; margin-top:8px;" src="haaland.jpeg">
            </div>
            <div class="channels" style="position:fixed; background-color: rgb(62,62,62); left:70px; bottom:0px; top:400px; width:130px;">
                <div class="info" style="display:flex; flex-direction: row; justify-content: space-between; align-items: center;">
                    <p style="font-family: arial; font-weight: 60%; color:white; font-size: 13px; margin-left:10px;">INFO</p>
                    <p style="color:gray; font-weight:bold; font-size: 20px; margin-right:20px;">+</p>
                </div>
                <p style="color:rgb(176, 176, 176); font-family: arial; margin-left:10px; font-size: 12px; margin-top:0px;"># new-videos</p>
                <p style="color:rgb(176, 176, 176); font-family: arial; margin-left:10px; font-size: 12px; margin-top:0px;"># updates</p>
                <p style="color:rgb(176, 176, 176); font-family: arial; margin-left:10px; font-size: 12px; margin-top:0px;"># faq</p>


            </div>
        </div>
    </div>
    </body>
</html>
