<!DOCTYPE html>
<html>
    <head>
        <title>DIV</title>
        <style>
            .square{
                background-color: red;
                width:200px;
                height:200px;
                display:inline-block;
                margin-right:50px;
            }
            .circle{
                background-color: green;
                width:200px;
                height:200px;
                border-radius: 400px;
                display:inline-block;
            }
            .shapes{
                height:200px;
                width:454px;
                border-color:black;
                border-style:solid;
                border-width: 1px;
                display:block;
            }
            .poll{
              margin-top:20px;
              border-style:solid;
              border-color:gray;
              border-width: 1px;
              padding-bottom:15px;
              padding-left:20px;
              width:200px;
              display:block;
            }
            .text{
              font-family: arial;
              font-size:15px;
            }
            .youtube-music{
              background-color: rgb(40, 40, 40);
              font-family: arial;
              width:400px;
            }
            .title{
              color:white;
              font-weight: bold;
              padding-top:20px;
              padding-left:20px;
              font-size: 20px;
            }
            .desc{
              color:gray;
              padding-left:20px;
              padding-right:20px;
              padding-bottom:20px;
              font-size:15px;

            }
            .messi-tw{
          margin-top:0;
          vertical-align: middle;
          width:60px;
          height:60px;
          margin-right:0;
          object-fit: cover;
          border-width: 1px;
          border-color:black;
          border-style: solid;
          border-radius: 60px;
          display:inline-block;
          opacity:0.8;
        }
        .what{
          font-family: arial;
          color:gray;
          display:inline-block;
          border:none;
          width:200px;
          padding-left:20px;

        }
        .tweet{
          font-family:arial;
          font-weight: bold;
          padding-top:8px;
          padding-bottom:8px;
          padding-left:20px;
          padding-right:20px;
          border:none;
          border-radius:20px;
          color:white;
          background-color: rgb(87, 179, 255);
          vertical-align: middle;
          display:inline-block;
          cursor:pointer;
          margin-left:20px;

        }
        .twitter-bar{
          border:none;
          width:400px;
          padding-top:10px;
          padding-bottom:10px;
          padding-left:10px;
          border-radius:5px;
          box-shadow:0px 0px 5px rgb(175, 175, 175);

        }
        .pic{
          vertical-align: top;
          font-size: 0;
          margin-top:50px;
          width:220px;
          height:350px;
          display:inline-block;
          border:none;

        }
        .propic{
          margin-top:0px;
          margin-left:10px;
          width:200px;
          height:200px;
          object-fit: cover;
          margin-bottom:0px;
          display:inline-block;
        }
        .propic2{
          margin-top:0px;
          margin-left:10px;
          width:200px;
          height:200px;
          object-fit: cover;
          object-position: top;
          margin-bottom:0px;
          display:inline-block;
        }
        .infos{
          border:none;
          padding-left:20px;
          font-family: arial;
          box-shadow: 0px 0px 4px rgb(175, 175, 175);
          width:180px;
          height:140px;
          margin-left:10px;
          margin-top:0;

        }
        .Name{
          padding-top:10px;
          font-size:20px;
          font-weight: bold;
          margin-top:0px;
          margin-bottom:0px;

        }
        .addpic{
        
        }
        .mutual-pic{
          width:20px;
          height:20px;
          border-radius: 20px;
          display:inline-block;
          object-fit: cover;
          object-position: top;
          vertical-align: middle;

        }
        .mutual-friends{
          font-size:13px;
          color:gray;
          width:100px;
          display:inline-block;
          vertical-align: middle;
          margin-left:10px;
        }
        .add{
          background-color: rgb(0, 128, 255);
          color:white;
          border:none;
          padding-left:20px;
          padding-right:20px;
          padding-top:10px;
          padding-bottom:10px;
          border-radius: 4px;
          margin-bottom:30px;
        }
        .Google{
          margin-left:50px;
          margin-top:50px;
          text-align: center;
          width:400px;
        }
        .google-logo{
          width:150px;
          height: 60px;
          object-fit:cover;

        }
        .google-search-bar{
          margin-top:3px;
          width:300px;
          padding-top:6px;
          padding-bottom:6px;
          border:none;
          border-radius:20px;
          padding-left:10px;
          box-shadow:0px 2px 5px rgb(101, 101, 101);
        }
        .google-button{
          margin-top:30px;
          border:none;
          background-color: rgb(244, 244, 244);
          padding-top:10px;
          padding-bottom:10px;
          margin-right:10px;
          font-family: arial;
          cursor:pointer;


        }
        </style>
        <body>
          <div class="shapes">
          <div class="square"></div>
          <div class="circle"></div>
          </div>
          <div class="poll">
            <p class="text">Satisfied with our service?</p>
            <button class="yes">Yes</button>
            <button class="no">No</button>
          </div>  
          <div class="youtube-music">
            <p class="title">Install YouTube Music</p>
            <p class="desc">Add YouTube Music to your desktop 
              for quick and easy access</p>
          </div>
          <div class="twitter-bar">
            <img class="messi-tw" src="Lionel-Messi.webp"> 
          <input class="what" placeholder="What's happening?">
          <button class="tweet">Tweet</button>
          </div>
          <div class="pic">
            <img class="propic" src="Lionel-Messi.webp">
            <div class="infos">
              <p class="Name">Lionel</p>
              <div class="addpic"></div>
              <img class="mutual-pic" src="haaland.jpeg">
              <p class="mutual-friends">2 mutual friends</p>
              <button class="add">Add Friend</button>
              </div>
            </div>
          </div>
          </div>
          <div class="pic">
          <img class="propic2" src="bellingham.jpg">
          <div class="infos">
            <p class="Name">Jude</p>
            <div class="addpic"></div>
              <img class="mutual-pic" src="haaland.jpeg">
            <p class="mutual-friends">3 mutual friends</p>
            <button class="add">Add Friend</button>
          </div>
        </div> 
        </div>
          <div class="pic">
          <img class="propic2" src="mbappe.jpg">
          <div class="infos">
            <p class="Name">Kylian</p>
            <div class="addpic"></div>
              <img class="mutual-pic" src="haaland.jpeg">
            <p class="mutual-friends">4 mutual friends</p>
            <button class="add">Add Friend</button>
          </div>
        </div> 

        <div class="Google">
          <img class="google-logo" src="google-logo.png">
          <input class="google-search-bar" 
          placeholder="Search Google or type a URL">
          <button class="google-button">Google Search</button>
          <button class="google-button">I'm feeling lucky</button>

        </div>
        </body>
    </head>
</html>
