
<!DOCTYPE html>
<html>
    <head>
        <title>Position practice</title>

    </head>
    <body style="height:3000px; padding-top:50px; padding-left:70px;">
        <div style="background-color: black; color:white;
        position:fixed; top:10px; left:0px; right:0px; height:40px;">Header</div>
        <div class="sidebar" style="position:fixed; top:50px; bottom:0px; left:0px; background-color: lightgreen; width:70px;">Sidebar
            <button class="assoluta" style="color:white; background-color: red; position:absolute; top:0px;right:0px; z-index:1; font-family: arial; border-radius:20px;width:20px; height:20px; font-size:10px; text-align:center; border-width: 1px;border-color:rgb(143, 0, 0); border-style:solid; cursor:pointer;">X</button>
        </div>
        <div style="background-color: lightblue; height:200px; width:200px;
        position: static;">div 1</div>
        <div style="background-color: lightpink; height:200px; width:200px;
        position: relative;">div 2
            <button class="assoluta" style=" position:absolute;color:white; background-color: red; position:absolute; bottom:10px;right:10px; z-index:1; font-family: arial; border-radius:20px;width:20px; height:20px; font-size:10px; text-align:center; border-width: 1px;border-color:rgb(143, 0, 0); border-style:solid; cursor:pointer;">X</button>
        </div>
    
        <button class="assoluta" style=" position:absolute;color:white; background-color: black; position:absolute; top:10px;right:10px; z-index:1; font-family: arial; border-radius:20px;width:20px; height:20px; font-size:10px; text-align:center; border-width: 1px;border-color:rgb(42, 42, 42); border-style:solid; cursor:pointer;">X</button>

        <div class="rectangle" style="z-index:1;position:fixed; bottom:20px; right:20px; background-color: gray; width:320px; height:180px; ">
        <button class="assoluta" style=" position:absolute;color:white; background-color: black; position:absolute; top:-7px;left:-7px; z-index:1; font-family: arial; border-radius:20px;width:20px; height:20px; font-size:10px; text-align:center; border-width: 1px;border-color:rgb(42, 42, 42); border-style:solid; cursor:pointer;">X</button>
            <p class="time" style="position:absolute; bottom:10px; right:10px; background-color: black; color:white; margin-bottom:0; font-family: arial; padding:4px; font-size: 12px; border-radius: 4px;">0:29</p>
        </div>

        <div class="shirt" style=" background-color: blue; margin-top:30px; width:200px; height:200px; position:relative; z-index:0;">

            <p style="position:absolute; background-color: black; color:white; padding-left:10px; padding-right:10px; padding-top:5px; padding-bottom:5px; right:0px; top:0px;">20% OFF</p>
            <div class="gray" style="display:flex; justify-content: center; background-color: rgba(228, 228, 228, 0.5); position:absolute; width:200px; height:50px; bottom:0px;">
                <button class="add" style="cursor:pointer; font-size:12px; padding:5px; position:absolute; bottom:15px; background-color: white; border-style:solid; border-width: 1px;">Add to Cart</button>
            </div>
            </div>
        <div class="shirt" style="background-color: blue; margin-top:30px; width:200px; height:200px; position:relative; z-index:0; left:200px; bottom:230px;">
