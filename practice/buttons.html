    <style>
    .subscribe-button {
      background-color: rgb(213, 4, 4);
      color: white;
      border: none;
      height: 40px;
      width: 120px;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 10px;
      transition: opacity 500ms;
    }
    .subscribe-button:hover{
      opacity:0.7;
    }
    .subscribe-button:active{
      opacity:0.4;

    }


  .join-button {
    background-color:white;
    border-color: rgb(71, 82, 242);
    color:rgb(71, 82, 242);
    border-radius: 3px;
    border-width: 1px;
    border-style: solid;
    height:40px;
    width: 65px;
    cursor: pointer;
    margin-right: 10px;
    transition: background-color 200ms, color 400ms ;
  }
  .join-button:hover {
    background-color:rgb(71, 82, 242) ;
    color:white;

  }
  .join-button:active {
    opacity:0.7;
  }

  .tweet-button{
    background-color: rgb(21, 138, 216);
    height: 40px;
    width: 65px;
    border-radius: 20px;
    color: white;
    font-weight: bold;
    border-color:rgb(44, 149, 219);
    border-style:solid;
    cursor: pointer;
    transition: box-shadow 0.1s;
  }
  .tweet-button:hover{
    opacity: 0.9;
    box-shadow: 0px 6px 10px rgba(0, 0, 0,0.2) ;
  }
</style>
<style>

}
