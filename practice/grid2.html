<!DOCTYPE html>
<html>
    <head>
        <title>Grid practice 2</title>

        <style>

        .friends-bar{
          margin-top:50px;
          display:grid;
          grid-template-columns: 200px 200px 200px;
          column-gap: 20px;
        }
        .block{
          width:100%;
        }
        .pic{
          height:200px;
          width:200px;
        }
        .propic{
          height:200px;
          width:100%;
        }
        .infos{
          display:grid;
          grid-template-rows: 30px 40px 60px;
          font-family: arial;
          box-shadow: 0px 0px 4px rgb(175, 175, 175);
          width:100%;
          height:140px;
        }
        .Name{
          padding-left:10px;
          padding-top:10px;
          font-size:20px;
          font-weight: bold;
          margin-top:2px;
        }
        .addpic{
          margin-left:10px;
        }
        .mutual-pic{
          width:24px;
          height:24px;
          border-radius: 24px;
          display:inline-block;
          object-fit: cover;
          object-position: top;
          vertical-align: middle;

        }
        .mutual-friends{
          font-size:13px;
          color:gray;
          width:100px;
          vertical-align: middle;
          margin-left:10px;
          display:inline-block;

        }
        .add{
          background-color: rgb(0, 128, 255);
          color:white;
          border:none;
          padding-top:8px;
          padding-bottom:8px;
          border-radius: 4px;
          margin-left:10px;
          margin-right:60px;
          margin-bottom:20px;
        }
        </style>
    </head>
    <body style="padding-bottom:1000px;">

          <div class="friends-bar">
            <div class="block">
                <div class="pic">
                    <img class="propic" src="Lionel-Messi.webp">
                </div>
                <div class="infos">
                   
                    <p class="Name">Lionel</p>
                    <div class="addpic">
                        <img class="mutual-pic" src="haaland.jpeg">
                    <p class="mutual-friends">2 mutual friends</p>
                    </div>
                    <button class="add">Add Friend</button>
                </div>
            </div>
            <div class="block">
                <div class="pic">
                    <img class="propic" src="bellingham.jpg">
                </div>
                <div class="infos">
                    <p class="Name">Jude</p>
                    <div class="addpic">
                        <img class="mutual-pic" src="haaland.jpeg">
                    <p class="mutual-friends">3 mutual friends</p>
                    </div>
                    <button class="add">Add Friend</button>
                </div>
            </div>
            <div class="block">
                <div class="pic">
                    <img class="propic" src="mbappe.jpg">
                </div>
                <div class="infos">
                    <p class="Name">Kylian</p>
                    <div class="addpic">
                        <img class="mutual-pic" src="haaland.jpeg">
                    <p class="mutual-friends">4 mutual friends</p>
                    </div>
                    <button class="add">Add Friend</button>
                </div>
            </div> 
    </body>
</html>
