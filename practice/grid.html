<!DOCTYPE html>
<html>
    <head>
        <title>Grid practice</title>

        <style>
          .pic{
          font-size: 0;
          margin-top:50px;
          border:none;

        }
        .propic{
          margin-top:0px;
          margin-left:10px;
          margin-bottom:0px;
          width:100%;

        }
        .propic2{
          margin-top:0px;
          margin-left:10px;
          margin-bottom:0px;
          width:100%;


        }
        .infos{
          border:none;
          padding-left:20px;
          font-family: arial;
          box-shadow: 0px 0px 4px rgb(175, 175, 175);
          width:180px;
          height:140px;
          margin-left:10px;
          margin-top:0;

        }
        .Name{
          padding-top:10px;
          font-size:20px;
          font-weight: bold;
          margin-top:0px;
          margin-bottom:0px;

        }
        .addpic{
        
        }
        .mutual-pic{
          width:20px;
          height:20px;
          border-radius: 20px;
          display:inline-block;
          object-fit: cover;
          object-position: top;
          vertical-align: middle;

        }
        .mutual-friends{
          font-size:13px;
          color:gray;
          width:100px;
          display:inline-block;
          vertical-align: middle;
          margin-left:10px;
        }
        .add{
          background-color: rgb(0, 128, 255);
          color:white;
          border:none;
          padding-left:20px;
          padding-right:20px;
          padding-top:10px;
          padding-bottom:10px;
          border-radius: 4px;
          margin-bottom:30px;
        }
        .friends-bar{
          margin-top:50px;
          display:grid;
          grid-template-columns: 200px 200px 200px;
          column-gap: 20px;
          align-items: center;
        }
        .block{
          width:200px;
          height:400px;
        }
        </style>
    </head>
    <body style="padding-bottom:1000px;">
        <div style="display:grid;
        grid-template-columns: 200px 200px;">
            <div style="background-color: blue;">div1</div>
            <div style="background-color: red;">div2</div>
        </div>
        <div style="display:grid;
        grid-template-columns: 200px 200px 300px;
        margin-top:30px;">
            <div style="background-color: blue;">div1</div>
            <div style="background-color: red;">div2</div>
            <div style="background-color: green;">div3</div>
        </div>
        <div style="display:grid;
        grid-template-columns: 200px 200px 1fr 3fr;
        margin-top:30px; column-gap: 20px;">
            <div style="background-color: blue;">div1</div>
            <div style="background-color: red;">div2</div>
            <div style="background-color: green;">div3</div>
            <div style="background-color: yellow;">div3</div>
          </div>
          <div style="display:grid;
        grid-template-columns: 1fr 1fr 1fr;
        margin-top:30px;column-gap: 20px; row-gap: 40px;">
            <div style="background-color: blue;
            height:200px;">div1</div>
            <div style="background-color: red;
            height:200px;">div2</div>
            <div style="background-color: green;
            height:200px;">div3</div>
            <div style="background-color: green;
            height:200px;">div1</div>
            <div style="background-color: blue;
            height:200px;">div2</div>
            <div style="background-color: red;
            height:200px;">div3</div>
            </div>  
            <p>ESERCIZI</p>
            <div style="display:grid;
            grid-template-columns: 200px 75px;">
            <div style="background-color: lightblue;">200px</div>
            <div style="background-color: lightpink;">75px</div>
            </div>

            <div style="display:grid;
            grid-template-columns: 50px 1fr 75px;
            margin-top:20px;">
            <div style="background-color: lightblue;">50px</div>
            <div style="background-color: lightgreen;">50px</div>
            <div style="background-color: lightpink;">75px</div>
            </div>

            <div style="display:grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            column-gap:20px;
            row-gap:10px;
            margin-top:20px;">
            <div style="background-color: lightblue;">col1</div>
            <div style="background-color: lightgreen;">col2</div>
            <div style="background-color: lightpink;">col3</div>
            <div style="background-color: lightyellow;">col4</div>
            <div style="background-color: lightblue;">col1</div>
            <div style="background-color: lightgreen;">col2</div>
            <div style="background-color: lightpink;">col3</div>
            <div style="background-color: lightyellow;">col4</div>
            </div>


          <div class="friends-bar">
            <div class="block">
            <div class="pic">
              <img class="propic" src="Lionel-Messi.webp">
            <div class="infos">
              <p class="Name">Lionel</p>
              <div class="addpic"></div>
                <img class="mutual-pic" src="haaland.jpeg">
              <p class="mutual-friends">2 mutual friends</p>
              <button class="add">Add Friend</button>
              </div>
            </div>
          </div>
          <div class="pic">
          <img class="propic2" src="bellingham.jpg">
          <div class="infos">
            <p class="Name">Jude</p>
            <div class="addpic"></div>
              <img class="mutual-pic" src="haaland.jpeg">
            <p class="mutual-friends">3 mutual friends</p>
            <button class="add">Add Friend</button>
          </div>
        </div> 
          <div class="pic">
          <img class="propic2" src="mbappe.jpg">
          <div class="infos">
            <p class="Name">Kylian</p>
            <div class="addpic"></div>
              <img class="mutual-pic" src="haaland.jpeg">
            <p class="mutual-friends">4 mutual friends</p>
            <button class="add">Add Friend</button>
          </div>
        </div>
      </div>
    </body>
</html>
